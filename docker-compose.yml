services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutrihogar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - nutrihogar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nutrihogar']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - nutrihogar-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nutrihogar}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY_ID
      $$MINIO_SECRET_ACCESS_KEY && mc mb --ignore-existing local/$$MINIO_BUCKET"

volumes:
  nutrihogar-postgres-data:
  nutrihogar-minio-data:
